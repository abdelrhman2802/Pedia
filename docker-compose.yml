services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: pediaatlas }
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  web:
    build: { context: ., args: { NEXT_PUBLIC_SITE_URL: "http://localhost:3000" } }
    environment: { DATABASE_URL: "postgresql://postgres:postgres@db:5432/pediaatlas" }
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {} }
